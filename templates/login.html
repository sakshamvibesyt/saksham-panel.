<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saksham Panel • Login</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"><style>body{background:#090711;color:#f6f2ff;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,92vw);padding:2rem;border:1px solid #38245c;border-radius:24px;background:#131020;box-shadow:0 20px 70px #6d28d933}h1 span{color:#b58cff}.muted{color:#aaa2bf}.err{color:#ff8fba}</style></head><body><main class="card"><p class="muted">SAKSHAM • CONTROL CENTER</p><h1>Welcome <span>back.</span></h1><p class="muted">Sign in to your private panel.</p>{% with messages = get_flashed_messages() %}{% for message in messages %}<p class="err">{{message}}</p>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Unlock dashboard ↗</button></form><small class="muted">Use your Render environment credentials.</small></main></body></html>
